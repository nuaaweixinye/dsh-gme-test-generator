# dsh-gme-workflow bundle patch — the `dsh.bundle.patch` layer of this package.
#
#   dsh plugin --profile web add dsh-gme-workflow
#
# installs the package and appends `dsh-gme-workflow` to the profile's
# `dsh.profile.bundles`; the next boot merges THIS patch (a single `insert` of
# the plugin row). No profile file has to be edited by hand.
#
# The row is always mounted; `backendRoot` below resolves to '' until
# GME_TEST_AGENT_ROOT exists. An empty backendRoot is a supported state rather
# than a failure: the plugin then registers no tools, logs one warning, and
# publishes the full configuration procedure to the model, so an agent asked for
# a GME task can tell the user how to finish the setup. It must never throw — a
# row whose config fails validation takes the entire plugin tree down with it
# ("dsh: 1 entry did not activate") — which is why the path is read as an
# expression with a fallback instead of being required.
#
# Two ways to configure it.
#
# 1. Environment (this layer already reads it):
#      $env:GME_TEST_AGENT_ROOT   = 'D:/workspace/gme-agent'
#      $env:GME_TEST_AGENT_PYTHON = 'C:/path/to/python.exe'   # optional, default 'python'
#    These must be present when Harness STARTS, not when a tool is called.
#
# 2. A profile patch override. `- id:` replaces only the keys it names, whole
#    `config` included, so restate every field you keep:
#
#      - id: gme-workflow
#        config:
#          backendRoot: D:/workspace/gme-agent
#          pythonPath: C:/ProgramData/Miniconda3/envs/agent/python.exe
#          port: 8765
#          autoStart: true
#
# Nothing else listens on `port`, and an independently started GME backend on
# that port is reused rather than replaced.
- insert:
    - id: gme-workflow
      name: 'dsh-gme-workflow'
      config:
        backendRoot: !!js process.env.GME_TEST_AGENT_ROOT ?? ''
        pythonPath: !!js process.env.GME_TEST_AGENT_PYTHON ?? 'python'
        autoStart: true
